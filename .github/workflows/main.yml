name: Build Kernel

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: kernel-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          set -euo pipefail
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/share/swift
          df -h /

      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc \
            bison \
            build-essential \
            cpio \
            flex \
            libelf-dev \
            libssl-dev \
            lz4 \
            pahole \
            python3 \
            rsync \
            unzip \
            xz-utils \
            zip \
            zstd

      - name: Prepare workspace
        run: |
          set -euo pipefail
          mkdir -p out/target/product/gts8wifi
          mkdir -p device/qcom/gki-kernel
          rm -rf out/msm-waipio-waipio-gki kernel_platform/out/msm-waipio-waipio-consolidate
          make -C kernel_platform/msm-kernel mrproper
          make -C kernel_platform/common mrproper

      - name: Build kernel
        run: |
          set -euo pipefail
          bash ./build_kernel_GKI.sh

      - name: Collect build artifacts
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cp device/qcom/gki-kernel/Image artifacts/
          cp device/qcom/gki-kernel/build.config artifacts/

          for file in Image.lz4 System.map vmlinux .config Module.symvers kernel-uapi-headers.tar.gz; do
            if [ -f "device/qcom/gki-kernel/${file}" ]; then
              cp "device/qcom/gki-kernel/${file}" artifacts/
            fi
          done

          if compgen -G 'device/qcom/gki-kernel/*.ko' > /dev/null; then
            mkdir -p artifacts/modules
            cp device/qcom/gki-kernel/*.ko artifacts/modules/
          fi

          if [ -d device/qcom/gki-kernel/vendor_dlkm ]; then
            tar -C device/qcom/gki-kernel -czf artifacts/vendor_dlkm.tar.gz vendor_dlkm
          fi

          if [ -d device/qcom/gki-kernel/kp-dtbs ]; then
            tar -C device/qcom/gki-kernel -czf artifacts/kp-dtbs.tar.gz kp-dtbs
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-build-artifacts
          path: artifacts/
          retention-days: 30
          if-no-files-found: error

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-build-logs
          path: |
            out/**/*.log
            kernel_platform/out/**/*.log
            device/qcom/gki-kernel/build.config
          retention-days: 7
          if-no-files-found: warn

      - name: Build summary
        if: always()
        run: |
          {
            echo "## Kernel build"
            echo "- Status: ${{ job.status }}"
            if [ -f artifacts/Image ]; then
              echo "- Image: built"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
