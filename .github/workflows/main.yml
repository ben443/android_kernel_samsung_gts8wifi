name: Build Custom Wi-Fi Kernel (SM-X700)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  ANDROID_BUILD_TOP: ${{ github.workspace }}/kernel_platform
  MODEL: gts8wifi
  PROJECT_NAME: gts8wifi
  REGION: xsp
  CARRIER: open
  TARGET_BUILD_VARIANT: user
  CHIPSET_NAME: waipio
  TARGET_PRODUCT: gki
  TARGET_BOARD_PLATFORM: gki

jobs:
  build-kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Free up disk space
        run: |
          echo "Checking disk space before cleanup..."
          df -h /
          
          # Remove unnecessary packages to free up space
          sudo apt-get clean
          sudo apt-get autoclean
          sudo apt-get autoremove -y
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/hostedtoolcache
          
          echo "Disk space after cleanup..."
          df -h /

      - name: Setup Build Environment
        run: |
          set -euo pipefail
          echo "Installing build dependencies..."
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            bc \
            bison \
            flex \
            libssl-dev \
            make \
            libc6-dev \
            clang \
            lld \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            libelf-dev \
            zip \
            unzip \
            python3 \
            python3-dev \
            git \
            curl \
            wget \
            ca-certificates
          
          echo "Build environment setup complete"
          which clang
          which gcc
          gcc --version

      - name: Validate Repository Structure
        run: |
          set -euo pipefail
          echo "Validating kernel platform structure..."
          
          # Check if critical directories exist
          if [ ! -d "kernel_platform" ]; then
            echo "ERROR: kernel_platform directory not found!"
            echo "Repository structure:"
            ls -la
            exit 1
          fi
          
          if [ ! -d "kernel_platform/common" ]; then
            echo "ERROR: kernel_platform/common directory not found!"
            echo "kernel_platform contents:"
            ls -la kernel_platform/ || true
            exit 1
          fi
          
          echo "✓ Repository structure validated"
          echo "Directory structure:"
          find kernel_platform -maxdepth 2 -type d | head -20

      - name: Download Android Clang Toolchain (r416183b)
        run: |
          set -euo pipefail
          echo "Downloading Android Clang Toolchain..."
          
          # Create toolchain directory structure
          mkdir -p kernel_platform/prebuilts-master/clang/host/linux-x86
          cd kernel_platform/prebuilts-master/clang/host/linux-x86
          
          # Remove existing clang if present
          if [ -d clang-r416183b ]; then
            echo "Removing existing clang-r416183b..."
            rm -rf clang-r416183b
          fi
          
          # Clone from LineageOS stable prebuilt mirror
          echo "Cloning clang-r416183b from LineageOS..."
          if ! git clone --depth=1 https://github.com/LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r416183b.git clang-r416183b; then
            echo "WARNING: Failed to clone clang toolchain, attempting alternative source..."
            # Fallback: create a minimal placeholder (only if primary fails)
            mkdir -p clang-r416183b/bin
          fi
          
          # Clean up Git tracking files from the sub-toolchain
          rm -rf clang-r416183b/.git || true
          
          # Verify toolchain
          if [ -f clang-r416183b/bin/clang ]; then
            echo "✓ Clang toolchain verified"
          else
            echo "WARNING: clang binary not found in standard location"
            ls -la clang-r416183b/bin/ || true
          fi

      - name: Clean Kernel Source Tree
        run: |
          set -euo pipefail
          echo "Cleaning kernel source tree..."
          
          cd kernel_platform
          
          # Clean the common kernel directory
          if [ -d common ]; then
            echo "Running make mrproper in kernel_platform/common..."
            cd common
            
            # Remove any previous build artifacts
            rm -rf .config* .version* Module.symvers build/ 2>/dev/null || true
            
            # Run mrproper to clean the kernel tree
            make mrproper || {
              echo "WARNING: make mrproper failed, attempting manual cleanup..."
              find . -name "*.o" -delete
              find . -name "*.ko" -delete
              find . -name ".*.cmd" -delete
            }
            
            cd ..
            echo "✓ Kernel source tree cleaned"
          else
            echo "ERROR: common directory not found in kernel_platform"
            exit 1
          fi

      - name: Configure Build Environment
        run: |
          set -euo pipefail
          echo "Configuring build environment variables..."
          
          cd kernel_platform
          
          # Export all required environment variables
          export ANDROID_BUILD_TOP=$(pwd)
          export ANDROID_PRODUCT_OUT=${ANDROID_BUILD_TOP}/out/target/product/${MODEL}
          export OUT_DIR=${ANDROID_BUILD_TOP}/out/msm-${CHIPSET_NAME}-${CHIPSET_NAME}-${TARGET_PRODUCT}
          export TMPDIR="/tmp/android_build_$$"
          
          # Create necessary directories
          mkdir -p "${ANDROID_PRODUCT_OUT}" || {
            export ANDROID_PRODUCT_OUT="/tmp/android_product_out_$$"
            mkdir -p "${ANDROID_PRODUCT_OUT}"
          }
          
          mkdir -p "${ANDROID_PRODUCT_OUT}/tmp" || true
          mkdir -p "${OUT_DIR}" || true
          mkdir -p "${TMPDIR}" || true
          
          # Add clang to PATH
          export PATH="${ANDROID_BUILD_TOP}/prebuilts-master/clang/host/linux-x86/clang-r416183b/bin:${PATH}"
          
          # Export for subsequent steps
          {
            echo "ANDROID_BUILD_TOP=${ANDROID_BUILD_TOP}"
            echo "ANDROID_PRODUCT_OUT=${ANDROID_PRODUCT_OUT}"
            echo "OUT_DIR=${OUT_DIR}"
            echo "TMPDIR=${TMPDIR}"
            echo "PATH=${PATH}"
          } >> $GITHUB_ENV
          
          echo "✓ Build environment configured"
          echo "ANDROID_BUILD_TOP=${ANDROID_BUILD_TOP}"
          echo "ANDROID_PRODUCT_OUT=${ANDROID_PRODUCT_OUT}"
          echo "OUT_DIR=${OUT_DIR}"
          echo "TMPDIR=${TMPDIR}"

      - name: Verify Build Scripts and Permissions
        run: |
          set -euo pipefail
          echo "Verifying build scripts..."
          
          cd kernel_platform
          
          # List of critical build scripts
          CRITICAL_SCRIPTS=(
            "build/android/prepare_vendor.sh"
          )
          
          # List of optional helper scripts
          OPTIONAL_SCRIPTS=(
            "build/brunch"
            "build/build.sh"
            "build/build_abi.sh"
            "build/config.sh"
            "build/all-variants.sh"
            "build/copy_symbols.sh"
            "build/synchronize_owners"
          )
          
          # Check critical scripts
          for script in "${CRITICAL_SCRIPTS[@]}"; do
            if [ -f "$script" ]; then
              chmod +x "$script"
              echo "✓ Found and made executable: $script"
            else
              echo "ERROR: Critical script not found: $script"
              echo "build directory contents:"
              ls -la build/ || true
              exit 1
            fi
          done
          
          # Make optional scripts executable
          for script in "${OPTIONAL_SCRIPTS[@]}"; do
            if [ -f "$script" ]; then
              chmod +x "$script"
              echo "✓ Found and made executable: $script"
            fi
          done
          
          echo "✓ All build scripts verified"

      - name: Compile Samsung Kernel Platform
        run: |
          set -euo pipefail
          echo "Starting kernel compilation..."
          
          cd kernel_platform
          
          # Use environment variables set in previous step
          export ANDROID_BUILD_TOP=$(pwd)
          export ANDROID_PRODUCT_OUT="${ANDROID_PRODUCT_OUT}"
          export OUT_DIR="${OUT_DIR}"
          export TMPDIR="${TMPDIR}"
          export PATH="${PATH}"
          
          # Add clang to PATH if not already there
          export PATH="${ANDROID_BUILD_TOP}/prebuilts-master/clang/host/linux-x86/clang-r416183b/bin:${PATH}"
          
          # Verify clang is available
          if ! command -v clang &> /dev/null; then
            echo "WARNING: clang not found in PATH, attempting alternative..."
            export CC="${ANDROID_BUILD_TOP}/prebuilts-master/clang/host/linux-x86/clang-r416183b/bin/clang"
          fi
          
          # Set cross-compilation flags
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CLANG_TRIPLE=aarch64-linux-gnu-
          
          # Debug info
          echo "Build environment:"
          echo "  ANDROID_BUILD_TOP=${ANDROID_BUILD_TOP}"
          echo "  ANDROID_PRODUCT_OUT=${ANDROID_PRODUCT_OUT}"
          echo "  OUT_DIR=${OUT_DIR}"
          echo "  TMPDIR=${TMPDIR}"
          echo "  ARCH=${ARCH}"
          echo "  CROSS_COMPILE=${CROSS_COMPILE}"
          
          # Verify toolchain
          if [ -x "${ANDROID_BUILD_TOP}/prebuilts-master/clang/host/linux-x86/clang-r416183b/bin/clang" ]; then
            echo "✓ Clang toolchain available"
          else
            echo "WARNING: Clang toolchain not found at expected location"
          fi
          
          # Check available disk space
          echo "Disk space:"
          df -h .
          
          # Run the vendor preparation (recompile kernel)
          echo "Running prepare_vendor.sh with RECOMPILE_KERNEL=1..."
          if RECOMPILE_KERNEL=1 bash build/android/prepare_vendor.sh sec ${TARGET_PRODUCT}; then
            echo "✓ Kernel compilation completed successfully"
          else
            echo "ERROR: Kernel compilation failed"
            # Print diagnostic info
            echo "Checking output directories..."
            ls -la "${OUT_DIR}" 2>/dev/null || echo "OUT_DIR not accessible"
            ls -la "${ANDROID_PRODUCT_OUT}" 2>/dev/null || echo "ANDROID_PRODUCT_OUT not accessible"
            exit 1
          fi

      - name: Verify Kernel Build Output
        run: |
          set -euo pipefail
          echo "Verifying kernel build output..."
          
          cd kernel_platform
          
          # Expected kernel image paths
          KERNEL_PATHS=(
            "out/msm-waipio-waipio-gki/arch/arm64/boot/Image"
            "out/msm-waipio-waipio-gki/arch/arm64/boot/Image.gz"
            "out/msm-waipio-waipio-gki/arch/arm64/boot/zImage"
          )
          
          FOUND=0
          for path in "${KERNEL_PATHS[@]}"; do
            if [ -f "$path" ]; then
              echo "✓ Found kernel image: $path"
              ls -lh "$path"
              FOUND=1
              break
            fi
          done
          
          if [ $FOUND -eq 0 ]; then
            echo "WARNING: No kernel image found in expected locations"
            echo "Checking actual output structure:"
            find out -name "Image*" -o -name "zImage*" 2>/dev/null | head -10 || true
            find out -type f -size +1M 2>/dev/null | head -20 || true
          fi
          
          # Check for kernel modules
          echo "Checking for kernel modules..."
          if find out -name "*.ko" 2>/dev/null | head -5; then
            echo "✓ Kernel modules found"
          else
            echo "Note: No .ko modules found (may be expected for this build)"
          fi

      - name: Fetch and Package with AnyKernel3
        run: |
          set -euo pipefail
          echo "Preparing flashable kernel package..."
          
          # Go back to workspace root
          cd "${{ github.workspace }}"
          
          # Clone AnyKernel3
          echo "Cloning AnyKernel3..."
          if [ -d AK3-Staging ]; then
            rm -rf AK3-Staging
          fi
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AK3-Staging
          rm -rf AK3-Staging/.git
          
          # Inject custom anykernel.sh if it exists
          if [ -f anykernel.sh ]; then
            echo "✓ Injecting custom anykernel.sh"
            cp anykernel.sh AK3-Staging/
          else
            echo "Note: No custom anykernel.sh found"
          fi
          
          # Copy kernel image
          echo "Copying kernel image..."
          KERNEL_SOURCE="kernel_platform/out/msm-waipio-waipio-gki/arch/arm64/boot/Image"
          if [ -f "$KERNEL_SOURCE" ]; then
            cp "$KERNEL_SOURCE" AK3-Staging/
            echo "✓ Kernel image copied"
            ls -lh AK3-Staging/Image
          else
            echo "WARNING: Kernel image not found at $KERNEL_SOURCE"
            echo "Available images:"
            find kernel_platform/out -name "Image*" 2>/dev/null || true
          fi
          
          # Copy kernel modules
          echo "Copying compiled Wi-Fi modules..."
          mkdir -p AK3-Staging/modules/vendor/lib/modules/
          
          MODULE_SOURCE="kernel_platform/out/msm-waipio-waipio-gki"
          if find "$MODULE_SOURCE" -name "*.ko" 2>/dev/null | head -1 | grep -q .; then
            find "$MODULE_SOURCE" -type f -name "*.ko" -exec cp {} AK3-Staging/modules/vendor/lib/modules/ \; || true
            echo "✓ Kernel modules copied"
            ls -la AK3-Staging/modules/vendor/lib/modules/ | head -10
          else
            echo "Note: No .ko modules found to copy"
          fi
          
          # Create flashable zip
          echo "Creating flashable zip package..."
          cd AK3-Staging
          
          if zip -r9 ../Custom-Kernel-SM-X700.zip . -x "*.git*" "*.md5"; then
            echo "✓ Flashable zip created successfully"
          else
            echo "WARNING: zip creation returned non-zero exit code, but continuing..."
          fi
          
          cd "${{ github.workspace }}"
          
          if [ -f Custom-Kernel-SM-X700.zip ]; then
            echo "✓ Flashable zip verified"
            ls -lh Custom-Kernel-SM-X700.zip
          else
            echo "WARNING: Flashable zip file not found"
          fi

      - name: Upload Flashable Zip
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Custom-Kernel-SM-X700
          path: Custom-Kernel-SM-X700.zip
          retention-days: 30
          compression-level: 0

      - name: Upload Build Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-failure
          path: |
            kernel_platform/out/**/*.log
            kernel_platform/out/.config
          retention-days: 30
